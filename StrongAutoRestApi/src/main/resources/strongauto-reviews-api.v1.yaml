openapi: 3.0.1
info:
  title: "StrongAUTO Reviews API v1"
  version: 1.0.0

servers:
  - url: localhost:3000/api/v1
    description: Open API specification
  - url: strongauto.mk/api/v1
    description: Open API specification
paths:
  /reviews:
    get:
      operationId: getReviews
      tags:
        - reviews
      description: Get reviews
      parameters:
        - $ref: "#/components/parameters/Accept-Language"
      responses:
        200:
          $ref: "#/components/responses/ReviewsResponse"
components:
  schemas:
    StarRating:
      type: integer
      minimum: 0
      maximum: 5
      description: |
        0 - Not specified
        1 - One star
        2 - Two stars
        3 - Three stars
        4 - Four stars
        5 - Five stars

    #    ReviewOwnerReply:
    #      type: object
    #      properties:
    #        comment:
    #          type: string
    #          description: "Comment"
    #        updateTime:
    #          type: string
    #          format: timestamp
    LocalizedText:
      type: object
      properties:
        text:
          type: string
          example: "Добра услуга"
        languageCode:
          type: string
          example: "mk"
    Reviewer:
      type: object
      properties:
        displayName:
          type: string
          example: "Name"
        photoUri:
          type: string
          example: "http://image.uri"
        uri:
          type: string
          example: "https://www.google.com/maps/contrib/contribId/reviews"
    Review:
      type: object
      required:
        - platform
        - publishTime
      properties:
        reviewer:
          $ref: "#/components/schemas/Reviewer"
        platform:
          type: string
          example: "Google"
        rating:
          $ref: "#/components/schemas/StarRating"
        text:
          type: string
          example: "Great service"
        originalText:
          $ref: "#/components/schemas/LocalizedText"
        publishTime:
          type: string
          format: timestamp
          example: "2024-09-04T08:34:07Z"
    Reviews:
      type: object
      properties:
        reviews:
          type: array
          items:
            $ref: "#/components/schemas/Review"
  responses:
    ReviewsResponse:
      description: Reviews list
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Reviews"
  parameters:
    Accept-Language:
      name: Accept-Language
      in: header
      description: Accept language header
      example: "en"
      required: false
      schema:
        type: string



