openapi: 3.0.1
info:
  title: 'Coding helper spec'
  version: 1.0.0

servers:
  - url: localhost:3000/api/v1
    description: Open API specification

paths:
  /vehicles:
    get:
      operationId: getVehicleEntries
      tags:
        - Vehicle
      description: Get all vehicles pageable
      parameters:
        - $ref: '#/components/parameters/Accept-Language'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - $ref: '#/components/parameters/Sort'
      responses:
        200:
          $ref: '#/components/responses/VehiclesResponse'


  /vehicles/{id}:
    get:
      operationId: getVehicleEntry
      tags:
        - Vehicle
      description: Get vehicle info
      parameters:
        - $ref: '#/components/parameters/Accept-Language'
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        200:
          $ref: '#/components/responses/VehicleResponse'

components:
  schemas:
    Decimal:
      type: string
      format: decimal
      description: Decimal value
      example: '5.25'

    Amount:
      type: object
      properties:
        currency:
          type: string
          enum:
            - MKD
            - EUR
          example: MKD
        value:
          $ref: '#/components/schemas/Decimal'

    Id:
      type: string
      description: Primary key

    Vehicle:
      type: object
      required:
        - id
        - title
        - amount
      properties:
        id:
          $ref: '#/components/schemas/Id'
        title:
          type: string
          description: Vehicle title
          example: 'Audi RS7'
        amount:
          $ref: '#/components/schemas/Amount'
        description:
          type: string
          description: Vehicle description
          example: |
            - 2.0 TDI
            - 4 new tires

    VehiclesResponse:
      type: object
      required:
        - vehicles
      properties:
        info:
          $ref: '#/components/schemas/PageInfo'
        vehicles:
          type: array
          items:
            $ref: '#/components/schemas/Vehicle'

    VehicleResponse:
      $ref: '#/components/schemas/Vehicle'

    PageInfo:
      type: object
      required:
        - totalPages
        - pageSize
        - pageNumber
      properties:
        totalPages:
          type: number
          example: 5
        pageSize:
          type: number
          example: 10
        pageNumber:
          type: number
          example: 10

  responses:
    VehiclesResponse:
      description: A list of pageable vehicle entries
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/VehiclesResponse'


    VehicleResponse:
      description: Vehicle info
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/VehicleResponse'


  parameters:
    Page:
      in: query
      name: page
      description: Page number
      required: false
      schema:
        type: number
        example: 1
        default: 1
    Size:
      in: query
      name: size
      description: Page size
      required: false
      schema:
        type: number
        default: 10
        example: 10
    Sort:
      in: query
      name: sortBy
      description: Sort by properties
      required: false
      schema:
        type: array
        default: []
        items:
          type: string
          example: 'id=asc,title=desc'

    Accept-Language:
      name: Accept-Language
      in: header
      description: Accept language header
      example: 'en'
      required: false
      schema:
        type: string



