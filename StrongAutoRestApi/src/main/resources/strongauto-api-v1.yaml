openapi: 3.0.1
info:
  title: "StrongAUTO api v1"
  version: 1.0.0

servers:
  - url: localhost:3000/api/v1
    description: Open API specification
  - url: strongauto.mk/api/v1
    description: Open API specification

paths:
  /vehicles/search:
    post:
      operationId: searchVehicleEntries
      tags:
        - vehicle
      description: Get all vehicles pageable
      parameters:
        - $ref: "#/components/parameters/Accept-Language"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
        - $ref: "#/components/parameters/Sort"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VehicleFilters'
      responses:
        200:
          $ref: "#/components/responses/VehiclesResponse"
        400:
          $ref: "#/components/responses/BadRequestResponse"
  /vehicles:
    post:
      operationId: createVehicleEntry
      tags:
        - vehicle
      description: Creates and saves vehicle entry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VehicleRequest"
      responses:
        201:
          $ref: "#/components/responses/CreatedResponse"
        400:
          $ref: "#/components/responses/BadRequestResponse"
  /vehicles/{id}:
    get:
      operationId: getVehicleEntry
      tags:
        - vehicle
      description: Get vehicle info
      parameters:
        - $ref: "#/components/parameters/Accept-Language"
        - name: id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Id'
      responses:
        200:
          $ref: "#/components/responses/VehicleResponse"
        404:
          $ref: "#/components/responses/NotFoundResponse"
    put:
      operationId: updateVehicleEntry
      tags:
        - vehicle
      description: Updates saved vehicle entry
      parameters:
        - name: id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VehicleRequest"
      responses:
        204:
          $ref: "#/components/responses/NoContentResponse"
        400:
          $ref: "#/components/responses/BadRequestResponse"
        404:
          $ref: "#/components/responses/NotFoundResponse"
    delete:
      operationId: deleteVehicleEntry
      tags:
        - vehicle
      description: Deletes saved vehicle entry
      parameters:
        - name: id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Id'
      responses:
        204:
          $ref: "#/components/responses/NoContentResponse"
        404:
          $ref: "#/components/responses/NotFoundResponse"
  /vehicle-makes:
    get:
      operationId: getVehicleMakeEntries
      tags:
        - vehicle-make
      description: Get all vehicle makes
      parameters:
        - $ref: "#/components/parameters/Accept-Language"
      responses:
        200:
          $ref: "#/components/responses/VehicleMakesResponse"
    post:
      operationId: createVehicleMakeEntry
      tags:
        - vehicle-make
      description: Creates and saves vehicle make entry
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VehicleMakeRequest"
      responses:
        201:
          $ref: "#/components/responses/CreatedResponse"
        400:
          $ref: "#/components/responses/BadRequestResponse"
  /vehicle-makes/{make}:
    get:
      operationId: getVehicleMakeEntry
      tags:
        - vehicle-make
      description: Get vehicle make with models
      parameters:
        - $ref: "#/components/parameters/Accept-Language"
        - in: path
          name: make
          required: true
          schema:
            $ref: "#/components/schemas/VehicleMakeValue"
      responses:
        200:
          $ref: "#/components/responses/VehicleMakeResponse"
        404:
          $ref: "#/components/responses/NotFoundResponse"
    put:
      operationId: updateVehicleMakeEntry
      tags:
        - vehicle-make
      description: Updates saved vehicle make entry
      parameters:
        - in: path
          name: make
          required: true
          schema:
            $ref: "#/components/schemas/VehicleMakeValue"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VehicleMakeRequest"
      responses:
        204:
          $ref: "#/components/responses/NoContentResponse"
        400:
          $ref: "#/components/responses/BadRequestResponse"
        404:
          $ref: "#/components/responses/NotFoundResponse"
    delete:
      operationId: deleteVehicleMakeEntry
      tags:
        - vehicle-make
      description: Delete saved vehicle make entry
      parameters:
        - in: path
          name: make
          required: true
          schema:
            $ref: "#/components/schemas/VehicleMakeValue"
      responses:
        204:
          $ref: "#/components/responses/NoContentResponse"
        404:
          $ref: "#/components/responses/NotFoundResponse"
components:
  schemas:
    Decimal:
      type: string
      format: decimal
      description: Decimal value
      example: '5.25'
    Year:
      type: integer
      description: year
      example: 2010

    Currency:
      type: string
      enum:
        - MKD
        - EUR
      example: "MKD"

    Amount:
      type: object
      properties:
        currency:
          $ref: "#/components/schemas/Currency"

    Id:
      type: integer
      format: int64
      description: Primary key
      example: 0

    VehicleState:
      type: string
      enum:
        - FEATURED
        - SOLD
      example: "SOLD"
    VehicleCondition:
      type: string
      enum:
        - NEW
        - USED
      example: "NEW"
    VehicleBodyType:
      type: string
      enum:
        - COUPE
        - HATCHBACK
        - CONVERTIBLE
        - SEDAN
        - SUV
        - SALOON
        - LIMOUSINE
      example: "COUPE"
    VehicleTransmission:
      type: string
      enum:
        - AUTOMATIC
        - MANUAL
      example: "AUTOMATIC"
    VehicleDriveType:
      type: string
      enum:
        - AWD_4WD
        - 2WD_FWD
        - 2WD_RWD
      example: "AWD_4WD"
    VehicleFuelType:
      type: string
      enum:
        - DIESEL
        - PETROL
        - ELECTRIC
      example: "DIESEL"
    VehicleColor:
      type: string
      enum:
        - BLACK
        - STEAL
        - SILVER
        - GRAY
        - RED
        - ORANGE
        - GOLD
        - YELLOW
        - BRONZE
        - LIME
        - IVORY
        - BROWN
        - BEECHWOOD
        - SAND
        - ALUMINIUM
        - CHROME
        - PINK
        - PURPLE
        - WHITE
        - BLUE
        - GREEN
      example: "BLACK"

    VehicleFilters:
      type: object
      properties:
        make:
          $ref: "#/components/schemas/VehicleMakeValue"
        model:
          $ref: "#/components/schemas/VehicleModelValue"
        priceFrom:
          $ref: "#/components/schemas/Decimal"
        priceTo:
          $ref: "#/components/schemas/Decimal"
        states:
          type: array
          items:
            $ref: "#/components/schemas/VehicleState"
        condition:
          $ref: "#/components/schemas/VehicleCondition"
        bodyTypes:
          type: array
          items:
            $ref: "#/components/schemas/VehicleBodyType"
        transmission:
          $ref: "#/components/schemas/VehicleTransmission"
        yearFrom:
          $ref: "#/components/schemas/Year"
        yearTo:
          $ref: "#/components/schemas/Year"
        mileageFrom:
          type: integer
          example: 100000
        mileageTo:
          type: integer
          example: 200000
        fuelType:
          $ref: "#/components/schemas/VehicleFuelType"
        color:
          $ref: "#/components/schemas/VehicleColor"
        features:
          type: array
          items:
            type: string
            example: "air_conditioner"

    VehicleAmount:
      allOf:
        - $ref: "#/components/schemas/Amount"
        - type: object
          required:
            - total
          properties:
            total:
              $ref: "#/components/schemas/Decimal"
            totalPromo:
              $ref: "#/components/schemas/Decimal"
            saving:
              $ref: "#/components/schemas/Decimal"

    VehicleRequest:
      type: object
      properties:
        state:
          $ref: "#/components/schemas/VehicleState"
        images:
          type: array
          items:
            type: string
            example: 'image'
        make:
          type: string
          example: "Audi"
        model:
          type: string
          example: "B8"
        amount:
          $ref: "#/components/schemas/VehicleAmount"
        title:
          type: string
          description: Vehicle title
          example: "Audi RS7"
        summary:
          type: string
          description: Vehicle summary
          example: Audi A4 2.0TDI
        transmission:
          $ref: "#/components/schemas/VehicleTransmission"
        fuelType:
          $ref: "#/components/schemas/VehicleFuelType"
        mileage:
          type: integer
          example: 250000
        year:
          $ref: "#/components/schemas/Year"
        driveType:
          $ref: "#/components/schemas/VehicleDriveType"
        description:
          type: string
          description: Vehicle description
          example: |
            - 2.0 TDI
            - 4 new tires
        engineSize:
          type: string
          example: "2.0"
        doors:
          type: integer
          example: 4
        bodyType:
          $ref: "#/components/schemas/VehicleBodyType"
        condition:
          $ref: "#/components/schemas/VehicleCondition"
        color:
          $ref: "#/components/schemas/VehicleColor"
        features:
          type: array
          items:
            type: string
            example: "air_conditioner"

    VehicleMakeRequest:
      type: object
      required:
        - make
      properties:
        make:
          $ref: "#/components/schemas/VehicleMakeValue"
        models:
          type: array
          items:
            $ref: "#/components/schemas/VehicleModel"


    VehicleEmbedded:
      type: object
      description: Vehicle embedded data
      required:
        - id
        - amount
        - title
      properties:
        id:
          $ref: "#/components/schemas/Id"
        state:
          $ref: "#/components/schemas/VehicleState"
        images:
          type: array
          items:
            type: string
            example: 'image'
        make:
          type: string
          example: "Audi"
        model:
          type: string
          example: "B8"
        amount:
          $ref: "#/components/schemas/VehicleAmount"
        title:
          type: string
          description: Vehicle title
          example: "Audi RS7"
        summary:
          type: string
          description: Vehicle summary
          example: Audi A4 2.0TDI
        transmission:
          $ref: "#/components/schemas/VehicleTransmission"
        fuelType:
          $ref: "#/components/schemas/VehicleFuelType"
        mileage:
          type: integer
          example: 250000
        year:
          $ref: "#/components/schemas/Year"
        driveType:
          $ref: "#/components/schemas/VehicleDriveType"
    VehicleEmbeddedResponse:
      allOf:
        - $ref: "#/components/schemas/VehicleEmbedded"
        - type: object
          properties:
            links:
              $ref: "#/components/schemas/SelfLink"
    VehiclesResponse:
      type: object
      required:
        - pageInfo
        - vehicles
      properties:
        info:
          $ref: "#/components/schemas/PageInfo"
        vehicles:
          type: array
          items:
            $ref: "#/components/schemas/VehicleEmbeddedResponse"
        links:
          $ref: "#/components/schemas/PaginationLinks"

    Vehicle:
      description: Vehicle full data
      allOf:
        - $ref: "#/components/schemas/VehicleEmbedded"
        - type: object
          properties:
            description:
              type: string
              description: Vehicle description
              example: |
                - 2.0 TDI
                - 4 new tires
            engineSize:
              type: string
              example: "2.0"
            doors:
              type: integer
              example: 4
            bodyType:
              $ref: "#/components/schemas/VehicleBodyType"
            condition:
              $ref: "#/components/schemas/VehicleCondition"
            color:
              $ref: "#/components/schemas/VehicleColor"
            features:
              type: array
              items:
                type: string
                example: "air_conditioner"
    VehicleResponse:
      allOf:
        - $ref: "#/components/schemas/Vehicle"
        - type: object
          properties:
            links:
              $ref: "#/components/schemas/SelfLink"

    VehicleModelValue:
      type: string
      example: 'B8'
    VehicleModel:
      type: object
      required:
        - model
      properties:
        model:
          $ref: "#/components/schemas/VehicleModelValue"

    VehicleMakeValue:
      type: string
      example: 'AUDI'
    VehicleMakeEmbedded:
      type: object
      required:
        - make
      properties:
        make:
          $ref: "#/components/schemas/VehicleMakeValue"
    VehicleMakeEmbeddedResponse:
      allOf:
        - $ref: '#/components/schemas/VehicleMakeEmbedded'
        - type: object
          properties:
            links:
              $ref: "#/components/schemas/SelfLink"
    VehicleMakesResponse:
      type: object
      required:
        - makes
      properties:
        makes:
          type: array
          items:
            $ref: "#/components/schemas/VehicleMakeEmbeddedResponse"

    VehicleMake:
      allOf:
        - $ref: "#/components/schemas/VehicleMakeEmbedded"
        - type: object
          required:
            - models
          properties:
            models:
              type: array
              items:
                $ref: "#/components/schemas/VehicleModel"
    VehicleMakeResponse:
      allOf:
        - $ref: '#/components/schemas/VehicleMake'
        - type: object
          properties:
            links:
              $ref: "#/components/schemas/SelfLink"

    Link:
      type: object
      properties:
        href:
          type: string
          example: .../api/v1/

    SelfLink:
      type: object
      required:
        - self
      properties:
        self:
          $ref: "#/components/schemas/Link"

    PaginationLinks:
      type: object
      properties:
        self:
          $ref: "#/components/schemas/Link"
        first:
          $ref: "#/components/schemas/Link"
        last:
          $ref: "#/components/schemas/Link"
        prev:
          $ref: "#/components/schemas/Link"
        next:
          $ref: "#/components/schemas/Link"

    PageInfo:
      type: object
      description: Pagination info
      required:
        - totalPages
        - pageSize
        - pageNumber
      properties:
        totalPages:
          type: number
          example: 5
        pageSize:
          type: number
          example: 10
        pageNumber:
          type: number
          example: 10

    ErrorResponse:
      type: object
      description: Error response
      required:
        - code
        - message
        - status
      properties:
        code:
          type: string
          example: "STRONGAUTO:0001"
        message:
          type: string
          example: "An error happened"
        status:
          type: integer
          example: 404

    CreatedResponse:
      type: object
      description: Self links response
      required:
        - links
      properties:
        links:
          $ref: "#/components/schemas/SelfLink"
  responses:
    VehicleMakesResponse:
      description: List of vehicle makes entries
      content:
        application/hal+json:
          schema:
            $ref: "#/components/schemas/VehicleMakesResponse"
    VehicleMakeResponse:
      description: Vehicle make info
      content:
        application/hal+json:
          schema:
            $ref: "#/components/schemas/VehicleMakeResponse"
    VehiclesResponse:
      description: A list of pageable vehicle entries
      content:
        application/hal+json:
          schema:
            $ref: "#/components/schemas/VehiclesResponse"
    VehicleResponse:
      description: Vehicle info
      content:
        application/hal+json:
          schema:
            $ref: "#/components/schemas/VehicleResponse"
    BadRequestResponse:
      description: Bad request error info
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFoundResponse:
      description: Not found error info
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    CreatedResponse:
      description: Created response
      content:
        application/hal+json:
          schema:
            $ref: "#/components/schemas/CreatedResponse"
    NoContentResponse:
      description: No content response.

  parameters:
    Page:
      in: query
      name: page
      description: Page number
      required: false
      schema:
        type: number
        example: 1
        default: 1
    Size:
      in: query
      name: size
      description: Page size
      required: false
      schema:
        type: number
        default: 10
        example: 10
    Sort:
      in: query
      name: sortBy
      description: Sort by properties
      required: false
      schema:
        type: array
        default: [ ]
        items:
          type: string
          example: "id=asc,title=desc"

    Accept-Language:
      name: Accept-Language
      in: header
      description: Accept language header
      example: "en"
      required: false
      schema:
        type: string



