server:
  port: 3000

spring:
  security:
    user:
      name: user
      password: password
  datasource:
    url: jdbc:h2:mem:mydb
    username: sa
    password: password
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: validate
      dialect: org.hibernate.dialect.H2Dialect

springdoc:
  swagger-ui:
    enabled: true
  api-docs:
    enabled: true
  show-actuator: true

google:
  businessApi:
    uri: https://mybusiness.googleapis.com/v4
  placesApi:
    apiKey: apiKey
    defaultPlaceId: ChIJ8SSGZkn_qRQR0O1XSyLI_s8
    uri: https://places.googleapis.com/v1

logging:
  level:
    org.springframework.web: DEBUG