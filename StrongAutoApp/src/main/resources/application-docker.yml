server:
  port: 3000

mock-db: true

spring:
  datasource:
    url: jdbc:h2:mem:strongauto-db
#    url: jdbc:h2:file:./strongauto-db
    username: sa
    password: password
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: validate
      dialect: org.hibernate.dialect.H2Dialect
    show-sql: true
  h2:
    console:
      enabled: true
