server:
  port: 3000

  servlet:
    context-path: /api/v1

spring:
  datasource:
    url: jdbc:h2:file:/strongauto-data
    username: sa
    password: password
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: validate
      dialect: org.hibernate.dialect.H2Dialect
