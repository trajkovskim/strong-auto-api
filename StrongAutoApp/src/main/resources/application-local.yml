server:
  port: 3000

mock-db: true

spring:
  security:
    user:
      name: user
      password: user
  datasource:
    url: jdbc:h2:mem:strongauto-db
    username: sa
    password: password
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: validate
      dialect: org.hibernate.dialect.H2Dialect
    show-sql: true
  h2:
    console:
      enabled: true
springdoc:
  swagger-ui:
    enabled: true
  api-docs:
    enabled: true
  show-actuator: true

logging:
  level:
    org.springframework.web: DEBUG