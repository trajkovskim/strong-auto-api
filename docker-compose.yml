version: '3'
services:
  strongauto-app:
    build: .
    container_name: strong-auto-app
    environment:
      - GOOGLE_PLACESAPI_APIKEY=apiKey
      - SPRING_SECURITY_USER_NAME=user
      - SPRING_SECURITY_USER_PASSWORD=password
      - SPRING_DATASOURCE_USERNAME=sa
      - SPRING_DATASOURCE_PASSWORD=password
    ports:
      - "3000:3000"
    volumes:
      - strongauto-h2-data:/strongauto/h2
